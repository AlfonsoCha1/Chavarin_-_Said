# PostgreSQL local para desarrollo. Uso: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lealtad
      POSTGRES_PASSWORD: lealtad_local
      POSTGRES_DB: lealtad
    ports:
      - "5432:5432"
    volumes:
      - lealtad_pg:/var/lib/postgresql/data
      - ./scripts/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  lealtad_pg:
