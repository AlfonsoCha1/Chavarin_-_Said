<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — personal del negocio</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<script type="module" src="/js/pages/entrar.js"></script>
</head>
<body>
<main class="wrap" style="max-width:520px">
  <h1>Entrar como personal</h1>
  <p class="muted">Cada persona usa su propia cuenta. No compartas tu contraseña ni la envíes por chat.</p>
  <form class="panel" id="form" novalidate>
    <div class="field"><label for="email">Correo</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div>
    <div id="msg"></div>
    <button class="btn btn-primary btn-big" type="submit">Entrar</button>
    <p class="small muted" style="margin-top:12px">¿Olvidaste tu contraseña? Pide al encargado o al dueño una contraseña temporal; mientras tanto, otro compañero autorizado puede atender.</p>
  </form>
  <form class="panel" id="pform" hidden novalidate>
    <h2>Cambia tu contraseña temporal</h2>
    <div class="field"><label for="current">Contraseña temporal</label><input id="current" type="password" autocomplete="current-password"></div>
    <div class="field"><label for="next">Nueva contraseña (mínimo 10 caracteres)</label><input id="next" type="password" autocomplete="new-password" minlength="10"></div>
    <div id="pmsg"></div>
    <button class="btn btn-primary" type="submit">Guardar y continuar</button>
  </form>
  <div id="demo"></div>
</main>
</body>
</html>
